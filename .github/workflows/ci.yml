
name: THRASH CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          npm run check
          find functions/api/v1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test
        run: npm test
